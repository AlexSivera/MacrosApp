name: Deploy web to GitHub Pages

# Builds the Flutter web target and publishes it to GitHub Pages on every
# push to main — the free, no-Mac-needed path to a PWA the user and their
# partner can add to their iPhone home screens. One-time manual step: enable
# Settings > Pages > Build and deployment > Source > "GitHub Actions" on
# this repo, or this workflow's deploy step has nothing to publish to.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Served at https://<user>.github.io/MacrosApp/ — base-href must match
      # the repo name or every asset/route resolves to the wrong path.
      # --pwa-strategy=none skips Flutter's own cache-first service worker:
      # with it, browsers happily keep serving an old cached build to anyone
      # who already has the PWA installed, sometimes for weeks. Without it,
      # every launch fetches index.html fresh and always gets the version
      # just deployed here — the app's own data (SQLite over IndexedDB) isn't
      # affected either way, since that never went through the service worker.
      # Offline support comes from web/sw.js instead (network-first, so the
      # always-latest behavior above is kept). --no-web-resources-cdn serves
      # CanvasKit from this site rather than gstatic.com, so it can be cached
      # for offline use too.
      - run: flutter build web --release --base-href /MacrosApp/ --pwa-strategy=none --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
