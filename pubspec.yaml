name: macrosapp
description: "Kalibra — control de calorias, macros, recetas y progreso."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado de la app
  flutter_riverpod: ^2.6.1

  # Base de datos local (SQLite): sqlite3_flutter_libs para nativo,
  # drift_flutter selecciona ese backend o el de wasm (web) según la
  # plataforma — ver lib/data/database/app_database.dart.
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  drift_flutter: ^0.2.8

  # Navegación
  go_router: ^14.8.1

  # Gráficas de progreso
  fl_chart: ^0.70.2

  # Formato de fechas (selector de día del Diario, etc.)
  intl: ^0.20.2

  # Tipografía de marca
  google_fonts: ^6.2.1

  # Celebración al completar el objetivo diario
  confetti: ^0.8.0

  # Selector de imagen para recetas
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generación de código para drift
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  sqlite3: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0C0E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0A0C0E"
    theme_color: "#0A0C0E"

flutter_native_splash:
  color: "#0A0C0E"
  image: assets/icon/icon_foreground.png
  color_dark: "#0A0C0E"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#0A0C0E"
    image_dark: assets/icon/icon_foreground.png
    icon_background_color_dark: "#0A0C0E"
  android: true
  ios: true
  web: false
