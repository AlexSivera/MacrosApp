name: macrosapp
description: "MacrosApp — control de calorias, macros, recetas y progreso."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado de la app
  flutter_riverpod: ^2.6.1

  # Base de datos local (SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navegación
  go_router: ^14.8.1

  # Gráficas de progreso
  fl_chart: ^0.70.2

  # Formato de fechas (selector de día del Diario, etc.)
  intl: ^0.20.2

  # Tipografía de marca
  google_fonts: ^6.2.1

  # Celebración al completar el objetivo diario
  confetti: ^0.8.0

  # Selector de imagen para recetas
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generación de código para drift
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
