workflows:
  android-debug:
    name: MacrosApp - Android Debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      android_signing: []
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - alexsivera.1999@gmail.com
        notify:
          success: true
          failure: true
