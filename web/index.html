<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Controla tus calorías, macros, recetas y progreso.">
  <meta name="theme-color" content="#0A0C0E">

  <!-- iOS "Add to Home Screen" support — apple-mobile-web-app-capable is the
       one Safari has honored the longest; mobile-web-app-capable is the
       newer standard tag, kept alongside it for other browsers. Without
       these the installed icon just opens a Safari tab instead of running
       standalone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalibra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kalibra</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash shown while Flutter loads, painted in the last theme the app
       used (saved by lib/core/platform/web_shell_web.dart) so a light or
       green theme doesn't open on a black flash, and vice versa. -->
  <style>
    html, body { margin: 0; height: 100%; background: var(--kalibra-bg, #0A0C0E); }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: inherit; transition: opacity 250ms ease-out; z-index: 10;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; animation: breathe 1.6s ease-in-out infinite; }
    #splash.hide { opacity: 0; pointer-events: none; }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } #splash { transition: none; } }
  </style>
  <script>
    (function () {
      try {
        var bg = localStorage.getItem('kalibra-bg');
        if (bg && /^#[0-9a-fA-F]{6}$/.test(bg)) {
          document.documentElement.style.setProperty('--kalibra-bg', bg);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        }
      } catch (e) { /* storage blocked: keep the dark default */ }
    })();
  </script>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 300);
    });

    // Offline support (see sw.js): network-first, so installs still always
    // get the latest deploy when online.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
